<!--
  Dấu nhận diện. Hai chỗ đã sửa so với bản xuất từ Figma:

  1. Bỏ `<rect fill="white">` phủ nền. Nền trắng cần cho ảnh xuất ra tệp, nhưng
     dán vào trang thì nó là một ô vuông trắng — ở chế độ tối trông như lỗi vẽ.
  2. Thu `viewBox` về đúng khung hình. Bản gốc là 2000×2000 trong khi nét chỉ
     chiếm khoảng một nửa, nên vẽ ở cỡ 28px thì hình thật chỉ còn ~19px.

  Khung dưới đây lấy từ `getBBox()` của chính đường nét, KHÔNG đọc bằng mắt từ
  toạ độ trong `d`: hộp thật là x [350, 1684], y [240.8, 1759.2], trong khi giá
  trị nhỏ nhất xuất hiện trong `d` là y=286.9. Đường Bézier phình ra NGOÀI điểm
  điều khiển của nó, nên lấy theo toạ độ trong `d` là cắt mất 46px đỉnh khối trên
  — bản trước bị đúng lỗi đó.

  Khung bám sát hộp thật với lề 40px ĐỀU bốn phía, nên nó KHÔNG vuông (1414×1598).
  Ép cho vuông thì lề dọc còn 31px trong khi lề ngang lên 123px — hình dán vào
  gần chạm mép trên dưới mà lại thụt sâu hai bên. Khung không vuông thì thẻ `<img>`
  vuông tự thu theo chiều cao và căn giữa ngang, tỉ lệ vẫn đúng.
-->
