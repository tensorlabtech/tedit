<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Overlay parity — nửa trang xem</title>
  </head>
  <body>
    <script type="module">
      // Nạp ĐÚNG tệp `.ttf` mà ffmpeg in ra, không nạp bản woff2 của gói giao
      // diện: cả phép kiểm này sinh ra để bắt lệch giữa hai đường vẽ, nên hai
      // bên phải đo trên cùng một tệp font.
      const { STYLE_PACKS } = await import("/server/style-pack-catalog.ts");
      for (const pack of STYLE_PACKS) {
        // Tên họ chữ lấy từ `cssStack` sau khi bóc dấu nháy — phải khớp đúng
        // chuỗi mà `overlay-render.tsx` đặt vào `fontFamily`, không thì trình
        // duyệt lặng lẽ đo bằng font thay thế và phép kiểm này đo nhầm thứ.
        // CẢ HAI vai chữ, vì các ca thử có cả cụm đi vai cảm xúc.
        for (const font of [pack.fonts.voice, pack.fonts.accent]) {
          const family = font.cssStack.split(",")[0].replace(/['"]/g, "").trim();
          const face = new FontFace(family, `url(/${font.file})`, {
            weight: String(font.cssWeight),
            style: font.italic ? "italic" : "normal",
          });
          await face.load();
          document.fonts.add(face);
        }
      }
      await document.fonts.ready;

      const { styleCase, packForElement } = await import("/server/style-pack.ts");
      const model = await import("/src/dev/overlays/overlay-model.ts");
      const render = await import("/src/dev/overlays/overlay-render.tsx");
      const { CASES } = await import("/scripts/overlay-parity/parity-cases.ts");

      window.__parity = STYLE_PACKS.flatMap((pack) =>
        CASES.map((item) => {
          // Chốt VAI CHỮ trước, rồi mới áp trục HOA và đo — đúng thứ tự của
          // đường in. Chốt sau là đo bằng font này in ra font kia.
          const shown = packForElement(pack, null, item.keywords);
          const text = styleCase(item.text, shown);
          const fitted = model.fitGroup(text, render.availOf(item.band), shown);
          return {
            pack: pack.id,
            text: item.text,
            band: item.band,
            lines: fitted.lines.length,
            scale: fitted.size,
          };
        }),
      );
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
